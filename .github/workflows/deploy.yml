name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 앱의 기록 동기화 커밋은 notes.json 만 바꾼다. 앱은 이 파일을 raw 에서 실행 중에 읽으므로 재배포가 필요 없다.
    # public/data/ 의 나머지(코스 데이터)는 빌드에 실려야 하므로 제외하지 않는다.
    paths-ignore:
      - 'public/data/notes.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 새 push가 오면 진행 중인 것을 취소한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
